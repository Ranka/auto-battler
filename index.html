<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100b16" />
    <title>Пепельное Солнце</title>
    <style>
      #game-status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }

      #launch-hint {
        max-width: 680px;
        margin: 15vh auto;
        padding: 32px;
        color: #c9bdad;
        background: #211728;
        border: 1px solid #49344f;
        font: 18px/1.5 Arial, sans-serif;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BjYLJpmA.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BoBNrNqY.css">
  </head>
  <body>
    <main id="app">
      <div id="launch-hint">
        Это исходный файл игры. Для запуска дважды щёлкните
        <strong>start-game.cmd</strong> в папке проекта — игра откроется через
        локальный сервер.
      </div>
      <div
        id="game-root"
        role="application"
        aria-label="Пепельное Солнце — браузерный автобаттлер"
      ></div>
      <label class="display-controls" for="display-mode">
        Масштаб
        <select id="display-mode">
          <option value="fit">По размеру окна</option>
          <option value="compact">Компактный</option>
        </select>
      </label>
      <p id="game-status" class="sr-only" aria-live="polite">
        Экран подготовки загружен
      </p>
    </main>
  </body>
</html>
